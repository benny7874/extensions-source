name: Build World Journal APK

on:
  push:
    branches:
      - worldjournal-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build World Journal
        run: ./gradlew :src:zh:worldjournal:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worldjournal-apk
          path: src/zh/worldjournal/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
